apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-tracker
  template:
    metadata:
      labels:
        app: task-tracker
    spec:
      containers:
        - name: task-tracker
          image: task-tracker:latest
          securityContext:
            privileged: true
            runAsUser: 0
          ports:
            - containerPort: 3000
          env:
            - name: STRIPE_API_KEY
              value: "stripe_test-key_51HZ9q2_FAKE_FOR_DEMO_0000000000"
